<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Assignment #1</title>
</head>
<body>
    <script>
        const userInput = prompt("Input integer number");
        const number = parseInt(userInput);

        if (number === 0) {
            alert("zero integer number");
        } else if (number % 2 === 0) {
            alert("even integer number");
        } else {
            alert("odd integer number");
        }
    </script>
</body>
</html>
